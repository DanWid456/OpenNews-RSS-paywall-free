name: opennews
description: Smarter News-Reader, der Artikel hinter Bezahlschranken ausblendet.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  xml: ^6.5.0
  html: ^0.15.4
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  in_app_purchase: ^3.2.0
  flutter_timezone: '>=3.0.1 <6.0.0'
  share_plus: '>=11.0.0 <14.0.0'
  file_selector: ^1.0.3
  home_widget: '>=0.7.0 <1.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/feeds.json
