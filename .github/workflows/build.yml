name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Solange kein android/-Ordner im Repository liegt, erzeugt ihn das
      # Skript tool/setup_android.sh (inkl. Homescreen-Widget aus
      # android_extra/).
      - name: Android-Projekt erzeugen (falls nicht vorhanden)
        run: |
          if [ ! -d android ]; then
            bash tool/setup_android.sh
          fi

      - run: flutter pub get

      - name: Statische Prüfung
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # UNLOCK_PRO schaltet Pro im Test-Build ohne Kauf frei.
      - name: Test-APK bauen
        run: flutter build apk --release --dart-define=UNLOCK_PRO=true

      - uses: actions/upload-artifact@v4
        with:
          name: opennews-apk
          path: build/app/outputs/flutter-apk/app-release.apk
