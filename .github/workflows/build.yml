name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Solange kein android/-Ordner im Repository liegt, wird er hier erzeugt.
      - name: Android-Projekt erzeugen (falls nicht vorhanden)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org ch.dawisoft --project-name opennews .
            rm -rf test
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
            sed -i 's#android:label="opennews"#android:label="OpenNews"#' android/app/src/main/AndroidManifest.xml
          fi

      - run: flutter pub get

      - name: Statische Prüfung
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # UNLOCK_PRO schaltet Pro im Test-Build ohne Kauf frei.
      - name: Test-APK bauen
        run: flutter build apk --release --dart-define=UNLOCK_PRO=true

      - uses: actions/upload-artifact@v4
        with:
          name: opennews-apk
          path: build/app/outputs/flutter-apk/app-release.apk
