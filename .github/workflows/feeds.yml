name: Feeds prüfen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/feeds.json
      - tool/check_feeds.py

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Feeds abrufen und Bericht schreiben
        run: python3 tool/check_feeds.py assets/feeds.json feeds_report.md

      - uses: actions/upload-artifact@v4
        with:
          name: feeds-report
          path: feeds_report.md
