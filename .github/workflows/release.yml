name: Release bauen (Play Store)

# Baut das signierte App-Bundle (.aab) für den Play Store. Startet nur von
# Hand: Actions → «Release bauen (Play Store)» → «Run workflow».
# Braucht vier Repository-Secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64  Upload-Schlüssel (.jks) als Base64-Text
#   UPLOAD_STORE_PASSWORD   Passwort des Schlüsselspeichers
#   UPLOAD_KEY_ALIAS        Alias des Schlüssels
#   UPLOAD_KEY_PASSWORD     Passwort des Schlüssels
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Upload-Schlüssel bereitstellen
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Das Secret UPLOAD_KEYSTORE_BASE64 fehlt."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Android-Projekt erzeugen (falls nicht vorhanden)
        run: |
          if [ ! -d android ]; then
            bash tool/setup_android.sh
          fi
          if ! grep -rq OPENNEWS_UPLOAD_SIGNING android/app/build.gradle*; then
            echo "Die Release-Signatur konnte nicht eingebaut werden."
            exit 1
          fi

      - run: flutter pub get

      - name: App-Bundle bauen
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Signatur prüfen
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee cert.txt
          if grep -q "CN=Android Debug" cert.txt; then
            echo "Das Bundle ist mit dem Test-Schlüssel signiert – abgebrochen."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: opennews-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
